<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Didar Kulturgemeinschaft</title>
<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f5f2;
    color: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 48px 40px;
    max-width: 500px;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    color: #1a1a1a;
  }
  p.subtitle {
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-block;
    background: #eef2ff;
    color: #3b3fa1;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  footer {
    margin-top: 30px;
    font-size: 0.85rem;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Testseite</span>
    <h1>Didar Kulturgemeinschaft</h1>
    <p class="subtitle">Stuttgart</p>
    <p>Dies ist eine Testseite. Der Inhalt wird bald aktualisiert.</p>
    <footer>&copy; 2026 Didar Kulturgemeinschaft</footer>
  </div>
</body>
</html>
